name: R SDK

on:
  push:
    paths: ["sdks/r/**", ".github/workflows/r-sdk.yml"]
  pull_request:
    paths: ["sdks/r/**", ".github/workflows/r-sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: R release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: sdks/r
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Verify generated documentation
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code -- NAMESPACE man DESCRIPTION
      - name: Check R source package
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning", check_dir = "artifacts")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-${{ matrix.os }}
          path: sdks/r/artifacts
